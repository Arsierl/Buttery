[package]
name = "natural-scroll"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
